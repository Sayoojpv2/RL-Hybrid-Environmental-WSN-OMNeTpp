# =====================================================================================================
# MODE 2 FIVE-SEED VALIDATION (11 Nov 2026): seeds 43-46 of the ten M2T_* / M2F_* configurations, nothing else
# changed. Seed 42 = the existing M2T_* / M2F_* outputs (reproduced byte for byte with this source before reuse).
# Every run seed keeps the seed-42 topology (topologySeed 42, relays from extraTopologySeed 900042 = the seed-42
# defaults). With the topology fixed, MATLAB's channel mapping rng(seed + r) would give seed 43 the channel blocks
# of seed 42 shifted by one round (499 of 500 shared), so seeds 43-46 use the independent mapping
# rng(1000000*seed + r): five disjoint channel streams. The run seed drives only the channel and the RL agent stream.
# =====================================================================================================
[Config M2_5S_Common]
description = "base of the Mode 2 five-seed runs, seeds 43-46 (not meant to be run alone)"
**.controller.scenarioSeed = ${rseed=43..46}   # own name: ${seed} (= 42) is already defined in Scn_Common
**.controller.outputPrefix = "${resultdir}/${configname}-seed${rseed}"
output-scalar-file = "${resultdir}/${configname}-seed${rseed}.sca"
**.controller.topologySeed = 42
**.controller.extraTopologySeed = 900042
**.controller.channelStream = "independent"

[Config M2T_Water_5S]
