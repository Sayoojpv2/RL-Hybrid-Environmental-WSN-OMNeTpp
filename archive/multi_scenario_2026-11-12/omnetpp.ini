# =====================================================================================================
# MULTI-SCENARIO ENVIRONMENTAL WSN (scenario study: scenario_study/, datasets in data/scenarios/)
# Network, radio and routing = V2_200Node_Common (200 nodes, 500 rounds, 2 J, first-order radio, report-preserving
# energy) + variant C (energyGuard 0.8), retransmission off, seed 42. Only the application data differ.
# Time base: 1 round = 1 h of environmental time (sampling, reporting, sensing ledger); the 100 s round slot is
# OMNeT++ scheduling only. Sensing energy goes to <prefix>-sensing_ledger.csv and is NEVER charged to the 2 J radio
# battery: these runs measure communication-network lifetime, not complete sensor-node battery lifetime.
#   Mode 1 (controlled): every scenario uses the 96,500 report slots of V2_200Node (m1_report) and 4000-bit packets.
#   Mode 2 (sensor-realistic, PREPARED, not run yet): each profile's periodic + alarm schedule (m2_report).
#     M2T_*: 4000-bit packet kept (radio energy per report = Mode 1); M2F_*: every report is charged with its own
#     profile's 802.15.4 frame (scenarioFrameBits: water 280, effluent 360, air 360, soil 264 / 328 on chemistry
#     rounds). packetSize = the scenario's smallest frame, used only as the one-packet reference of the
#     minimum-energy rule (E < E_elec x packetSize). Neither mode is a MATLAB-equivalent experiment.
# =====================================================================================================
[Config Scn_Common]
description = "base of the multi-scenario configurations (not meant to be run alone)"
extends = V2_200Node_Common
**.controller.scenarioSeed = ${seed=42}
**.controller.energyGuard = 0.8
