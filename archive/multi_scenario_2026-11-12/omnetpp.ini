# =====================================================================================================
# MATLAB V2 10-NODE EXPERIMENT (<USER_HOME>\Documents\MATLAB\RL_WSN_Periyar_V2_10Nodes, run_experiment.m):
# 10 nodes that all sense AND forward (no relay-only nodes), one BS; node positions = reference-layout nodes
# 4,8,...,48 of the seeded 600 x 50 m layout; the 212 sampling dates mapped over a 1000-round schedule, of which
# rounds 1-500 are simulated; report-preserving energy (a route frame with m reports = m packets); 2 J, 4000 bit.
# Dataset: data/v2_consdata_loaded.csv = the table V2's load_consdata_xlsx() reads from consdata.xlsx
# (exported by matlab_reference/scripts/export_reference_v2.m). Validate with tools/compare_v2.py.
# =====================================================================================================
[Config V2_Common]
description = "base of the MATLAB V2 10-node configurations (not meant to be run alone)"
result-dir = results_v2_10node
PeriyarRiverNetwork.numNodes = 10
**.controller.topologyMode = "stationPositions"
**.controller.stationNodeIds = "4,8,12,18,22,28,32,38,42,48"
**.controller.reportPreservingEnergy = true
**.controller.workloadRounds = 500
**.controller.scheduleRounds = 1000
**.controller.numRounds = 500
**.controller.datasetPath = "data/v2_consdata_loaded.csv"
**.controller.datasetFields = "Temperature|temperature|degC|15|50; pH|pH|pH|0|14; Conductivity|conductivity|uS/cm|>0|inf; TDS|TDS|mg/L|>0|inf"
**.controller.stationMap = "ALUVA - MANAPPURAM=1; PURAPILLIKADAVU US=2; PURAPILLIKADAVU BUND NAVIGATION=3; PURAPILLIKADAVU BUND DS=4; PATHALAM BUND U/S=5; PATHALAM BUND D/S=6; PATHALAM BRIDGE=7; PUTHALAM KADAVU=8; MANJUMMAL BUND=9; VETTUKADAVU=10"
**.controller.exportReference = true
**.controller.exportChannel = true
sim-time-limit = 5000s
cmdenv-status-frequency = 5s

[Config V2_10Node]
description = "MATLAB V2: 10 sensing+forwarding nodes, rounds 1-500, seeds 42-46"
extends = V2_Common
**.controller.scenarioSeed = ${seed=42,43,44,45,46}

[Config V2_10Node_Smoke]
description = "MATLAB V2 10-node, seed 42, first 20 of 500 rounds (smoke test)"
extends = V2_Common
**.controller.scenarioSeed = ${seed=42}
**.controller.numRounds = 20
sim-time-limit = 200s

# =====================================================================================================
# CONFIGURABLE NETWORK SIZE (V2 model). Change ONLY numNodes (here or on the command line:
#   --PeriyarRiverNetwork.numNodes=100). Every node senses and forwards; there are no relay-only nodes.
#   nodes 1-10  : the V2 station positions and the real KSPCB Periyar reports (unchanged; N = 10 = V2_10Node)
#   nodes 11-N  : positions drawn inside the area from the extra-topology stream (900000 + seed);
#                 SYNTHETIC placeholder reports labelled SYNTHETIC-n<id> (generated values, not measurements),
#                 one report per node per round, same packet size and energy model
# Fixed area 600 x 50 m: more nodes = higher node density AND more offered traffic (every node reports).
# =====================================================================================================
[Config V2_Scalable]
result-dir = results_v2_scalable
description = "V2 RL-Hybrid with configurable numNodes (all nodes sense + forward), seeds 42-46, 500 rounds"
extends = V2_Common
PeriyarRiverNetwork.numNodes = ${N=10}                 # <- the only line to change (e.g. ${N=100})
**.controller.scenarioSeed = ${seed=42,43,44,45,46}
**.controller.workloadMode = "mixed"
**.controller.syntheticSources = "others"
**.controller.syntheticFields = "temperature|degC|30|1.5|0.5; pH|pH|7.2|0.3|0.1; conductivity|uS/cm|300|100|50; TDS|mg/L|170|60|30"
**.controller.syntheticSeed = ${seed}
**.controller.syntheticPeriodRounds = 100
# simulated time slot per round (OMNeT++ scheduling only; MATLAB has no clock): decisions are processed one after
# another, so larger networks need a longer slot. N <= 40 keeps the validated 10 s (identical output at N = 10).
**.controller.roundPeriod = (${N} <= 40 ? 10s : 0.25s * ${N})
sim-time-limit = 100000s
**.controller.outputPrefix = "${resultdir}/${configname}-N${N}-seed${seed}"

[Config V2_ScalingSweep]
description = "V2 RL-Hybrid scaling sweep: numNodes 10..500 x seeds 42-46, 500 rounds, fixed 600 x 50 m area"
extends = V2_Common
result-dir = results_v2_scaling
PeriyarRiverNetwork.numNodes = ${N=10,20,50,100,200,500}
**.controller.scenarioSeed = ${seed=42,43,44,45,46}
**.controller.workloadMode = "mixed"
**.controller.syntheticSources = "others"
**.controller.syntheticFields = "temperature|degC|30|1.5|0.5; pH|pH|7.2|0.3|0.1; conductivity|uS/cm|300|100|50; TDS|mg/L|170|60|30"
**.controller.syntheticSeed = ${seed}
**.controller.syntheticPeriodRounds = 100
# simulated time slot per round (OMNeT++ scheduling only; MATLAB has no clock): decisions are processed one after
# another, so larger networks need a longer slot. N <= 40 keeps the validated 10 s (identical output at N = 10).
**.controller.roundPeriod = (${N} <= 40 ? 10s : 0.25s * ${N})
sim-time-limit = 100000s
**.controller.exportDecisionLog = false
**.controller.exportChannel = false
**.controller.outputPrefix = "${resultdir}/${configname}-N${N}-seed${seed}"

# EXPERIMENTAL VARIANT (not part of the MATLAB benchmark): link-layer retransmission, 1 retry per undecoded frame.
# Identical to V2_10Node otherwise. Retry outcome = independent draw at the round's true link quality.
[Config V2_10Node_Retx1]
description = "EXPERIMENTAL: V2 10-node + 1 retransmission per undecoded frame, seeds 42-46, 500 rounds"
extends = V2_Common
result-dir = results_v2_10node_retx1
**.controller.scenarioSeed = ${seed=42,43,44,45,46}
**.controller.enableRetransmission = true
**.controller.maxRetransmissions = 1

# =====================================================================================================
# 200-NODE ENVIRONMENTAL RL-HYBRID (extended OMNeT++ simulation; NOT validated against a 200-node MATLAB model)
# V2 model (V2_Common): 600 x 50 m, BS (600,25), 2 J, 4000 bit, first-order radio, report-preserving energy,
# 500 rounds of the 1000-round KSPCB schedule, MATLAB V2 workload fields (temperature, pH, conductivity, TDS) from
# data/v2_consdata_loaded.csv (= MATLAB load_consdata_xlsx output of consdata.xlsx).
# Nodes 1-10: the 10 real KSPCB stations (V2 positions and mapping). Nodes 11-200: VIRTUAL dataset-replay sensors;
# node k replays the measured stream of station ((k-1) mod 10) + 1 (20 nodes per station stream), labelled
# REPLAY-n<k>:<station>; positions from the extra-topology stream (900000 + seed). Every node senses and forwards.
# Round slot 100 s of simulated time (scheduling only). Variants differ from V2_200Node in ONE setting.
# =====================================================================================================
[Config V2_200Node_Common]
description = "base of the 200-node configurations (not meant to be run alone)"
extends = V2_Common
PeriyarRiverNetwork.numNodes = 200
**.controller.replaySources = "others"
**.controller.roundPeriod = 100s
sim-time-limit = 100000s
**.controller.exportDecisionLog = false
**.controller.exportChannel = false
**.controller.outputPrefix = "${resultdir}/${configname}-seed${seed}"

[Config V2_200Node]
description = "200-node BASELINE: original RL-Hybrid, seeds 42-46 (development)"
extends = V2_200Node_Common
result-dir = results_200node_optimization/dev/baseline
**.controller.scenarioSeed = ${seed=42,43,44,45,46}

[Config V2_200Node_Diag]
description = "200-node baseline, seed 42, full decision + transmission logs (bottleneck analysis)"
extends = V2_200Node_Common
result-dir = results_200node_optimization/dev/baseline_diag
**.controller.scenarioSeed = ${seed=42}
**.controller.exportDecisionLog = true
**.controller.exportDiagnostics = true

[Config V2_200Node_RetxUnrestricted]
description = "A0: one retry per undecoded frame, no energy check (reference for A)"
extends = V2_200Node_Common
result-dir = results_200node_optimization/dev/retx_unrestricted
**.controller.scenarioSeed = ${seed=42,43,44,45,46}
**.controller.enableRetransmission = true
**.controller.maxRetransmissions = 1

[Config V2_200Node_RetxEnergyAware]
description = "A: one retry only if sender and receiver keep >= reserve x 2 J after it"
extends = V2_200Node_Common
result-dir = results_200node_optimization/dev/retx_energy_aware
**.controller.scenarioSeed = ${seed=42,43,44,45,46}
**.controller.enableRetransmission = true
**.controller.maxRetransmissions = 1
**.controller.retryEnergyReserve = ${reserve=0.25,0.5}
**.controller.outputPrefix = "${resultdir}/${configname}-reserve${reserve}-seed${seed}"

[Config V2_200Node_QPrior]
description = "B: untried actions start at the prior expected one-step reward (update rule and reward unchanged)"
extends = V2_200Node_Common
result-dir = results_200node_optimization/dev/qprior
**.controller.scenarioSeed = ${seed=42,43,44,45,46}
**.controller.qPriorInit = true

[Config V2_200Node_EnergyAwareRouting]
description = "C: next hop / cluster head candidates below guard x mean candidate energy are skipped"
extends = V2_200Node_Common
result-dir = results_200node_optimization/dev/energy_aware_routing
**.controller.scenarioSeed = ${seed=42,43,44,45,46}
**.controller.energyGuard = ${guard=0.5,0.8}
**.controller.outputPrefix = "${resultdir}/${configname}-guard${guard}-seed${seed}"

[Config V2_200Node_AdaptiveEpsilon]
description = "D: epsilon schedules - constant 0.05 | 0.25 decaying 0.99/round to ~0 | 0.25 decaying 0.99/round, floor 0.01"
extends = V2_200Node_Common
result-dir = results_200node_optimization/dev/adaptive_epsilon
**.controller.scenarioSeed = ${seed=42,43,44,45,46}
**.controller.epsilonInitial = ${ei=0.05,0.25,0.25}
**.controller.epsilonMinimum = ${em=0.05,0.0,0.01 ! ei}
**.controller.epsilonDecayPerRound = ${ed=1.0,0.99,0.99 ! ei}
**.controller.outputPrefix = "${resultdir}/${configname}-ei${ei}-em${em}-ed${ed}-seed${seed}"

# Combinations of the two most promising single changes (selected from the development stage, seeds 42-46)
[Config V2_200Node_GuardEps]
description = "C+D: energy guard 0.8 + epsilon 0.25 decaying 0.99/round with floor 0.01"
extends = V2_200Node_Common
result-dir = results_200node_optimization/dev/guard_eps
**.controller.scenarioSeed = ${seed=42,43,44,45,46}
**.controller.energyGuard = 0.8
**.controller.epsilonInitial = 0.25
**.controller.epsilonMinimum = 0.01
**.controller.epsilonDecayPerRound = 0.99

[Config V2_200Node_GuardRetx]
description = "C+A: energy guard 0.8 + one energy-aware retry (reserve 0.5)"
extends = V2_200Node_Common
result-dir = results_200node_optimization/dev/guard_retx
**.controller.scenarioSeed = ${seed=42,43,44,45,46}
**.controller.energyGuard = 0.8
**.controller.enableRetransmission = true
**.controller.maxRetransmissions = 1
**.controller.retryEnergyReserve = 0.5

# FINAL EVALUATION (independent seeds 47-66; development used 42-46)
[Config V2_200Node_Final]
description = "FINAL: 200-node baseline (original RL-Hybrid), seeds 47-66"
extends = V2_200Node_Common
result-dir = results_200node_optimization/final/baseline
**.controller.scenarioSeed = ${seed=47..66}

[Config V2_200Node_EnergyAwareRouting_Final]
description = "FINAL: selected variant C - energy guard 0.8, seeds 47-66"
extends = V2_200Node_Common
result-dir = results_200node_optimization/final/energy_aware_routing
**.controller.scenarioSeed = ${seed=47..66}
