#
# RLHybrid_Scalability_Experiment - configurations (copy of the validated Periyar project + relay-density scaling)
#
#   ReferenceCheck   Stage B: build workload + topology (+ all channel bits) for seeds 42..46,
#                    no rounds simulated; outputs are compared with the MATLAB export
#   SmokeSeed42      Stage C: full 1000-round experiment, seed 42
#   FiveSeeds        Stage D: seeds 42, 43, 44, 45, 46 (run only after SmokeSeed42 passes)
#   GuiDemo20Rounds  PREVIEW for Qtenv: seed 42, only rounds 1-20 of 1000 (200 of the 10,000 slots;
#                    121 of them carry data). Not a benchmark result.
#   Seed42FullGui    the complete 1000-round seed-42 experiment for watching in Qtenv; identical
#                    model to SmokeSeed42 but writes its own files, so the validated
#                    SmokeSeed42 outputs are never overwritten from the GUI
#
# The seed drives, exactly as in MATLAB: the topology (generate_scenario rng(seed)), the
# channel of round r (rng(seed + r)) and the exploration stream of RL_Hybrid.m (rng(seed)).
# All three are bit-exact MATLAB 'twister' streams (MatlabRng.h); the OMNeT++ RNGs are unused.
#

[General]
network = PeriyarRiverNetwork
sim-time-limit = 10000s                      # 1000 rounds x 10 s
cmdenv-express-mode = true
cmdenv-status-frequency = 30s
**.cmdenv-log-level = warn
record-eventlog = false
**.controller.datasetPath = "data/Periyar_WaterQuality_Project.csv"
**.controller.outputPrefix = "${resultdir}/${configname}-seed${seed}"
**.controller.numRounds = 1000
**.controller.roundPeriod = 10s
**.bs.hops.result-recording-modes = mean
**.bs.pathDelay.result-recording-modes = mean,count
**.bs.latency.result-recording-modes = mean

[Config ReferenceCheck]
description = "Stage B: workload, topology and channel export for comparison with MATLAB (no rounds)"
**.controller.scenarioSeed = ${seed=42,43,44,45,46}
**.controller.numRounds = 0
**.controller.exportReference = true
**.controller.exportChannel = true
sim-time-limit = 1s

[Config SmokeSeed42]
description = "Stage C: seed 42, full 1000 rounds"
**.controller.scenarioSeed = ${seed=42}
**.controller.exportReference = true

[Config FiveSeeds]
description = "Stage D: seeds 42-46, full 1000 rounds each"
**.controller.scenarioSeed = ${seed=42,43,44,45,46}

[Config GuiDemo20Rounds]
description = "PREVIEW: seed 42, rounds 1-20 of 1000 only (200 of 10,000 slots) - not a benchmark result"
**.controller.scenarioSeed = ${seed=42}
**.controller.numRounds = 20
sim-time-limit = 200s

[Config Seed42FullGui]
description = "Full 1000-round seed-42 Periyar experiment for Qtenv (same model as SmokeSeed42; separate output files)"
**.controller.scenarioSeed = ${seed=42}

# =====================================================================================
# RELAY-DENSITY SCALING (fixed 600 m x 50 m area, BS at (600,25), fixed 10-source real Periyar
# workload). PeriyarRiverNetwork.numNodes = N: nodes 1..50 are the MATLAB topology (unchanged);
# nodes 51..N are relay-only, placed uniformly from a dedicated stream (900000 + seed).
# The configurations above (N = 50) are the validated MATLAB reproduction and are unchanged.
# =====================================================================================

[Config Periyar50_Baseline]
description = "50 nodes = the MATLAB experiment, seeds 42-46 (must equal FiveSeeds)"
PeriyarRiverNetwork.numNodes = 50
**.controller.scenarioSeed = ${seed=42,43,44,45,46}

[Config Periyar100_Smoke]
description = "Smoke test: 100 nodes (10 sources + 90 relays), seed 42, 20 rounds"
PeriyarRiverNetwork.numNodes = 100
**.controller.scenarioSeed = ${seed=42}
**.controller.numRounds = 20
**.controller.exportReference = true
**.controller.exportChannel = true
sim-time-limit = 200s
cmdenv-status-frequency = 1s

[Config Periyar250_Smoke]
description = "Smoke test: 250 nodes (10 sources + 240 relays), seed 42, 20 rounds"
extends = Periyar100_Smoke
PeriyarRiverNetwork.numNodes = 250

[Config Periyar500_Smoke]
description = "Smoke test: 500 nodes (10 sources + 490 relays), seed 42, 20 rounds"
extends = Periyar100_Smoke
PeriyarRiverNetwork.numNodes = 500

[Config Periyar100_RelayScaling]
description = "100 nodes (10 sources + 90 relays), seeds 42-46, 1000 rounds"
PeriyarRiverNetwork.numNodes = 100
**.controller.scenarioSeed = ${seed=42,43,44,45,46}
**.controller.exportReference = true
cmdenv-status-frequency = 5s

[Config Periyar250_RelayScaling]
description = "PRIMARY: 250 nodes (10 sources + 240 relays), seeds 42-46, 1000 rounds"
extends = Periyar100_RelayScaling
PeriyarRiverNetwork.numNodes = 250

[Config Periyar500_RelayScaling]
description = "500 nodes (10 sources + 490 relays), seed 42, 1000 rounds"
PeriyarRiverNetwork.numNodes = 500
**.controller.scenarioSeed = ${seed=42}
**.controller.exportReference = true
cmdenv-status-frequency = 5s

[Config Periyar250_GuiPreview]
description = "PREVIEW for Qtenv: 250 nodes, seed 42, rounds 1-20 only - not a result"
PeriyarRiverNetwork.numNodes = 250
**.controller.scenarioSeed = ${seed=42}
**.controller.numRounds = 20
sim-time-limit = 200s
