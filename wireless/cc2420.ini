# CC2420-class IEEE 802.15.4 radio for INET 4.7.0 (included by wireless/pilot.ini and by the ieee802154 configs of
# omnetpp.ini, so the pilot and the RL network use exactly the same radio). Section-less: belongs to the including section.
**.energyStorage.**.result-recording-modes = -vector
**.wlan.**.result-recording-modes = -vector,-vector(packetBytes)   # INET statistics: scalars only
# CC2420-class radio and power states (TI CC2420 datasheet SWRS041c, measured at 3.3 V, 25 C):
# nominal output power 0 dBm, sensitivity -95 dBm (PER 1 %); RX 18.8 mA, TX 17.4 mA at 0 dBm, idle 426 uA,
# power down 20 uA, voltage regulator off 0.02 uA. Power = current x 3.3 V.
**.wlan.radio.transmitter.power = 1mW
**.wlan.radio.receiver.sensitivity = -95dBm
**.wlan.radio.receiver.energyDetection = -77dBm   # CCA threshold: CC2420 CCA_THR reset value (~ -77 dBm), CCA_MODE 3
# CCA mode 3 = busy when energy >= threshold or a frame is being received (INET receptionState BUSY/RECEIVING)
*.node[*].wlan.radio.energyConsumer.typename = "StateBasedEpEnergyConsumer"   # battery nodes only (the BS is mains powered)
**.energyConsumer.offPowerConsumption = 0.000066mW
**.energyConsumer.sleepPowerConsumption = 0.066mW
**.energyConsumer.switchingPowerConsumption = 1.4058mW
**.energyConsumer.receiverIdlePowerConsumption = 62.04mW
**.energyConsumer.receiverBusyPowerConsumption = 62.04mW
**.energyConsumer.receiverReceivingPowerConsumption = 62.04mW
**.energyConsumer.transmitterIdlePowerConsumption = 1.4058mW
**.energyConsumer.transmitterTransmittingPowerConsumption = 57.42mW
